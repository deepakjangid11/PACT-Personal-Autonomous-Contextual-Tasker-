[project]
name = "pact"
version = "0.1.0"
description = "PACT — Personal Autonomous Contextual Tasker"
readme = "README.md"
authors = [
    { name = "Deepak Jangid" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.16.1",
]

[project.scripts]
pact = "pact.main:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
