[project]
name = "pact"
version = "0.1.0"
description = "PACT — Personal Autonomous Contextual Tasker"
readme = "README.md"
authors = [
    { name = "Deepak Jangid" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.16.1",
]

[project.scripts]
pact = "pact.main:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src","tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
